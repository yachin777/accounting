<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B57">
<!--
  家庭記帳（網頁）
  這個檔案要貼到 Google 試算表的 Apps Script 裡，檔名取 index。
  樣式（<style>）和功能（<script>）都在這一個檔案裡，每一段開頭都有註解說明。
-->
<title>家庭記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* ===== css/base.css ===== */
/* ==========================================================
   css/base.css
   顏色主題（淺色／深色）、字型。想換配色改 :root 裡的變數。
   ========================================================== */

html{color-scheme:light}
[hidden]{display:none!important}
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEDE7; --line:#E2DED5;
  --ink:#1F2421; --ink-2:#5B625D; --ink-3:#8F948F;
  --accent:#2F6B57; --accent-soft:#DCEBE4;     /* 主色（綠） */
  --inc:#2F7A55;  --inc-soft:#DDEFE5;          /* 收入 */
  --exp:#B8483E;  --exp-soft:#F6E1DD;          /* 支出 */
  --tr:#8A6A1F;   --tr-soft:#F3EAD3;           /* 還款 */
  --pa:#3567A6;   --pb:#C0506F;                /* 兩個人的代表色 */
  --shadow:0 1px 2px rgba(20,30,25,.05),0 4px 14px rgba(20,30,25,.05);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121614; --surface:#1B201D; --surface-2:#242A26; --line:#323A35;
    --ink:#E9EEEA; --ink-2:#B3BCB6; --ink-3:#7F8983;
    --accent:#6FC3A3; --accent-soft:#1F3A30;
    --inc:#6CC596; --inc-soft:#1E3429;
    --exp:#EE8A7E; --exp-soft:#3D2420;
    --tr:#D9B65E; --tr-soft:#382E18;
    --pa:#7FA9E0; --pb:#E68AA4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614; --surface:#1B201D; --surface-2:#242A26; --line:#323A35;
  --ink:#E9EEEA; --ink-2:#B3BCB6; --ink-3:#7F8983;
  --accent:#6FC3A3; --accent-soft:#1F3A30;
  --inc:#6CC596; --inc-soft:#1E3429;
  --exp:#EE8A7E; --exp-soft:#3D2420;
  --tr:#D9B65E; --tr-soft:#382E18;
  --pa:#7FA9E0; --pb:#E68AA4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.3}
</style>
<style>
/* ===== css/app.css ===== */
/* ==========================================================
   css/app.css
   版面與元件：頁首、分頁列、卡片、列表、分帳、統計、表單。
   ========================================================== */

/* ---------- 版面 ---------- */
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.top h1{font-size:19px;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.logo.big{width:56px;height:56px;font-size:26px;border-radius:16px;margin:0 auto 12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}

/* 底部分頁列 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;max-width:170px;background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}

/* 記一筆按鈕 */
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 324px));bottom:calc(74px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:13px 20px 13px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab svg{width:20px;height:20px}

/* ---------- 共用元件 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card.pad{padding:16px}
.card h3{font-size:15px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:500}
.btn.small{padding:6px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--exp);border-color:var(--exp-soft);margin-right:auto}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;padding-bottom:2px}
.chips.cwrap{flex-wrap:wrap;overflow:visible;margin:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;color:var(--ink-3);padding:36px 12px}
.empty.small{padding:12px}
.hint{color:var(--ink-3);font-size:13px;margin:6px 0 12px}
.notice{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.notice.err{background:var(--exp-soft);color:var(--exp)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.pa-A{background:var(--pa)}.dot.pa-B{background:var(--pb)}
span.pa-A{color:var(--pa)}span.pa-B{color:var(--pb)}

/* 月份切換 */
.monthbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.monthbar b{font-size:17px;min-width:118px;text-align:center}

/* 三格統計 */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats3>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stats3 small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats3 b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inc{color:var(--inc)}.exp{color:var(--exp)}

/* ---------- 明細列表 ---------- */
.day{margin-bottom:4px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 6px}
.day-h small{color:var(--ink-3)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.cat{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.cat.exp{background:var(--exp-soft);color:var(--exp)}
.cat.inc{background:var(--inc-soft);color:var(--inc)}
.cat.tr{background:var(--tr-soft);color:var(--tr)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{display:flex;gap:8px;align-items:baseline;min-width:0}
.row-t .note{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{color:var(--ink-3);font-size:12.5px}
.row-main .owe{color:var(--accent);font-weight:500}
.row-main .run{color:var(--ink-2)}
.amt{flex:none;font-weight:700}
.amt.tr{color:var(--tr)}

/* ---------- 分帳 ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);text-align:center;padding:20px 16px;margin:6px 0 12px}
.hero small{color:var(--ink-3)}
.hero-who{font-size:18px;font-weight:700;margin-top:2px}
.hero-big{font-size:40px;font-weight:700;letter-spacing:.5px;margin:2px 0 12px}
.hero.even .hero-big{color:var(--inc);margin-bottom:0}
.hero.even p{margin:0;color:var(--ink-3)}

/* ---------- 統計 ---------- */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:14px}
.hb-k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.hb-fill{display:block;height:100%;border-radius:999px}
.hb-fill.exp{background:var(--exp)}.hb-fill.inc{background:var(--inc)}
.hb-v{text-align:right;min-width:92px}
.hb-v small{color:var(--ink-3);margin-left:6px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child{text-align:left}
.tbl thead th{color:var(--ink-3);font-weight:500;font-size:13px}
.trend{display:flex;gap:8px;align-items:flex-end;height:150px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:4px}
.tcol small{color:var(--ink-3);font-size:12px}
.tcol.cur small{color:var(--ink);font-weight:700}
.tbars{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.tb{width:38%;max-width:18px;border-radius:4px 4px 0 0;min-height:1px}
.tb.inc{background:var(--inc)}.tb.exp{background:var(--exp)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend i.inc{background:var(--inc)}.legend i.exp{background:var(--exp)}

/* ---------- 設定 ---------- */
.pfield{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pfield .dot{margin:0}
.pf-l{font-weight:700;color:var(--ink-2);width:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.acct-btns{display:flex;gap:8px;flex-wrap:wrap}
img.avatar{object-fit:cover}
.field.need .lbl::after{content:'（請選擇）';color:var(--exp);margin-left:4px}
input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--ink);min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.tag button{border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;padding:0 4px}
.addcat{display:flex;gap:8px}
.addcat input{flex:1}
.login{text-align:center;margin-top:40px;padding:32px 20px}
.login h2{margin-bottom:6px}
.login p{color:var(--ink-2)}
.gbtn{display:flex;justify-content:center;min-height:44px;align-items:center;margin:16px 0 4px;color:var(--ink-3)}
.login .notice{justify-content:center}

/* ---------- 表單 ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--ink-3)}
.sheet-b{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:13px;color:var(--ink-2)}
input.big{font-size:22px;font-weight:700;padding:7px 11px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.preview{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.preview b{color:var(--accent);font-size:16px}
.preview small{color:var(--ink-2)}

/* 提示訊息 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <!-- ===== 頁首 ===== -->
  <header class="top">
    <div class="logo" aria-hidden="true">帳</div>
    <h1>家庭記帳</h1>
    <div class="who" id="who"></div>
  </header>
  <!-- ===== 主要內容（由 js/views/ 產生） ===== -->
  <main id="view"><div class="empty">載入中…</div></main>
</div>

<!-- ===== 底部分頁列（按鈕由 js/render.js 產生） ===== -->
<nav class="tabbar" id="tabbar" aria-label="分頁"></nav>

<!-- ===== 右下角「記一筆」按鈕 ===== -->
<button class="fab" id="fab" type="button" data-action="new">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>記一筆</span>
</button>

<!-- ===== 新增／編輯表單（欄位由 js/form.js 產生） ===== -->
<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="sheet-h"><h2 id="formTitle">記一筆</h2><button type="button" class="x" data-action="close" aria-label="關閉">×</button></div>
    <div class="sheet-b" id="formBody"></div>
    <div class="sheet-f">
      <button type="button" class="btn danger" id="delBtn" data-action="delete" hidden>刪除</button>
      <button type="button" class="btn" data-action="close">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>


<!-- ===== 網頁功能（順序很重要，main.js 必須最後） ===== -->
<script>
// ==========================================================
// js/constants.js
// 固定設定：分頁、記帳類型、分攤方式、預設分類。
// ==========================================================

// 底部分頁（id 對應 js/views/ 裡的畫面）
const VIEWS=[
  {id:'records',label:'明細',icon:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'},
  {id:'settle', label:'分帳',icon:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>'},
  {id:'stats',  label:'統計',icon:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:'settings',label:'設定',icon:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'}
];

// 記帳類型
const TYPES=[
  {id:'expense', label:'支出'},
  {id:'income',  label:'收入'},
  {id:'transfer',label:'還款'}   // 兩人之間互相還錢（會抵銷分帳的欠款）
];

// 支出的分攤方式
//   equal  = 兩人平分
//   custom = 自己填兩人各吃多少
//   mine   = 付錢的人自己的花費（不用分）
//   other  = 全部是對方的（幫對方代墊）
const SPLITS=[
  {id:'equal', label:'平分'},
  {id:'custom',label:'各付各的（自訂）'},
  {id:'mine',  label:'自己的'},
  {id:'other', label:'幫對方付'}
];

// 收入歸屬
const INCOME_OWNERS=[{id:'A'},{id:'B'},{id:'both',label:'共同'}];

// 預設設定（第一次使用時；之後在「設定」分頁修改，存在雲端）
const DEFAULT_SETTINGS={
  nameA:'', nameB:'',      // 兩人的名字
  expenseCats:['餐飲','日用品','交通','居家','水電瓦斯','娛樂','購物','醫療','孝親','旅遊','其他'],
  incomeCats:['薪水','獎金','投資','紅包','其他']
};

// 「統計」分頁的趨勢圖要顯示幾個月
const TREND_MONTHS=6;
</script>
<script>
// ==========================================================
// js/utils.js
// 小工具：文字跳脫、金額、日期、提示訊息。
// ==========================================================

const $=s=>document.querySelector(s);
// 把文字裡的特殊符號轉掉，避免破壞畫面
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 金額：1234.5 → $1,234.5
function money(n){n=Math.round((+n||0)*100)/100;return (n<0?'-$':'$')+Math.abs(n).toLocaleString('zh-TW',{maximumFractionDigits:2})}
// 四捨五入到小數兩位（避免 0.1+0.2 這種誤差）
function r2(n){return Math.round((+n||0)*100)/100}
// 今天：YYYY-MM-DD（台灣時間）
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
// 月份往前／往後：shiftMonth('2026-01',-1) → '2025-12'
function shiftMonth(m,n){let [y,mo]=m.split('-').map(Number);mo+=n;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return `${y}-${String(mo).padStart(2,'0')}`}
// '2026-10' → '2026 年 10 月'
function monthLabel(m){const [y,mo]=m.split('-');return `${y} 年 ${+mo} 月`}
// '2026-10-03' → '10/3（六）'
function dayLabel(d){const t=new Date(d+'T00:00:00');return `${t.getMonth()+1}/${t.getDate()}（${'日一二三四五六'[t.getDay()]}）`}
// 顯示提示訊息幾秒
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}
</script>
<script>
// ==========================================================
// js/state.js
// 畫面狀態與資料（全部都放在 state 裡，改完呼叫 render() 重畫）。
// ==========================================================

const state={
  view:'records',            // 目前分頁
  month:today().slice(0,7),  // 「明細」「統計」看的月份
  filter:'all',              // 明細篩選：all / expense / income / transfer
  settleAll:false,           // 分帳：false = 只看上次結清後；true = 全部
  entries:[],                // 所有記帳資料
  settings:{...DEFAULT_SETTINGS},
  ready:false,               // 資料是否載入完成
  authError:'',
  user:'',                   // 登入的 Google 帳號（Email）
  draft:null                 // 表單正在編輯的資料
};

// 取得名字：nm('A') → 設定裡的名字，沒填就顯示「成員A」
function nm(p){return (p==='A'?state.settings.nameA:state.settings.nameB)||('成員'+p)}
// 另一個人
function other(p){return p==='A'?'B':'A'}
</script>
<script>
// ==========================================================
// js/calc.js
// 分帳計算（最重要的邏輯都在這裡）。
//
// 每筆支出都記錄：誰付的（payer）、兩人各自的份額（shareA、shareB）。
//   付錢的人幫對方墊了「對方的份額」→ 對方欠付錢的人這麼多。
// 每筆還款記錄：誰給誰（from → to）多少錢 → 抵銷欠款。
//
// 統一用一個數字表示兩人的帳：
//   正數 = B 欠 A；負數 = A 欠 B；0 = 兩清
//
// 例：午餐 500 由 B 付、平分 → A 欠 B 250 → -250
//     晚餐 600 由 A 付、B 吃 200 → B 欠 A 200 → +200
//     合計 -50 → A 要給 B 50
// ==========================================================

// 依分攤方式算出兩人的份額
function computeShares(amount,payer,split,customA){
  amount=r2(amount);
  if(split==='mine')  return payer==='A'?{shareA:amount,shareB:0}:{shareA:0,shareB:amount};
  if(split==='other') return payer==='A'?{shareA:0,shareB:amount}:{shareA:amount,shareB:0};
  if(split==='custom'){const a=Math.min(Math.max(r2(customA),0),amount);return {shareA:a,shareB:r2(amount-a)}}
  // 平分：除不盡時，多出的零頭算在付錢的人身上（對方只要給整數）
  const half=Math.floor(amount/2), rest=r2(amount-half);
  return payer==='A'?{shareA:rest,shareB:half}:{shareA:half,shareB:rest};
}

// 一筆資料對兩人帳的影響（正數 = B 欠 A 增加）
function effect(e){
  if(e.type==='expense')  return e.payer==='A'?r2(e.shareB):-r2(e.shareA);
  if(e.type==='transfer') return e.from==='A'?r2(e.amount):-r2(e.amount);   // A 還給 B → A 欠 B 減少
  return 0;
}

// 用一句話說明這筆資料的影響
function effectText(e){
  const v=effect(e);if(!v)return '';
  if(e.type==='transfer')return `${nm(e.from)} 還給 ${nm(e.to)} ${money(e.amount)}`;
  const debtor=v>0?'B':'A';
  return `${nm(debtor)} 要給 ${nm(other(debtor))} ${money(Math.abs(v))}`;
}

// 依日期排序（舊 → 新；同一天依建立時間）
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.createdAt||'')<(b.createdAt||'')?-1:1}

// 計算目前兩人的帳，並列出每一筆的變化
//   balance：目前結餘（正數 = B 欠 A）
//   rows：每筆會影響帳的資料與當時累計
//   lastZero：最後一次兩清是在第幾筆之後（用來只顯示「未結清」的部分）
function settlement(entries){
  const rows=[];let bal=0,lastZero=-1;
  for(const e of [...entries].sort(byDate)){
    const v=effect(e);if(!v)continue;
    bal=r2(bal+v);rows.push({e,v,bal});
    if(Math.abs(bal)<0.005)lastZero=rows.length-1;
  }
  return {balance:bal,rows,lastZero};
}

// 某段期間的統計（entries 已先篩選好期間）
function summarize(list){
  const s={income:0,expense:0,cats:{},incomeCats:{},paidA:0,paidB:0,useA:0,useB:0};
  for(const e of list){
    if(e.type==='expense'){
      s.expense+=e.amount;s.cats[e.category||'其他']=(s.cats[e.category||'其他']||0)+e.amount;
      if(e.payer==='A')s.paidA+=e.amount;else s.paidB+=e.amount;
      s.useA+=e.shareA||0;s.useB+=e.shareB||0;
    }else if(e.type==='income'){
      s.income+=e.amount;s.incomeCats[e.category||'其他']=(s.incomeCats[e.category||'其他']||0)+e.amount;
    }
  }
  for(const k of ['income','expense','paidA','paidB','useA','useB'])s[k]=r2(s[k]);
  return s;
}
</script>
<script>
// ==========================================================
// 資料存取：新增／修改／刪除都經過這裡。
//   sheets = 在 Google Apps Script 上開啟時，資料存在 Google 試算表（Code.gs 的 api 函式）
//   local  = 直接用瀏覽器開這個檔案時，資料只存在這個瀏覽器（測試用）
// 另一半新增的資料：每 30 秒、切回這個頁面時，會自動重新讀取。
// ==========================================================

const LOCAL_KEY='acc-local', REFRESH_MS=30000;
const store={
  mode:'local',sheetUrl:'',busy:0,
  async init(){
    if(window.google?.script?.run){
      this.mode='sheets';
      await this.refresh(true);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.refresh()});
      setInterval(()=>{if(!document.hidden)this.refresh()},REFRESH_MS);
      return;
    }
    try{const raw=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');
      if(raw){state.entries=raw.entries||[];state.settings={...DEFAULT_SETTINGS,...raw.settings}}}catch{}
    state.ready=true;render();
  },
  // 呼叫 Code.gs 裡的函式，例如 call('apiSave', item)
  call(fn,...args){
    return new Promise((ok,fail)=>google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e=>fail({message:String(e?.message||e).replace(/^Error:\s*/,'')}))
      [fn](...args));
  },
  // 重新讀取全部資料（first = 第一次載入，失敗時要顯示錯誤）
  async refresh(first){
    if(this.mode!=='sheets'||this.busy)return;
    try{
      const j=await this.call('apiList');
      if(this.busy)return;   // 讀取途中有人在存檔，等下次再更新，避免畫面跳回舊資料
      state.entries=j.entries||[];
      state.settings={...DEFAULT_SETTINGS,...j.settings};
      state.user=j.user||'';this.sheetUrl=j.sheetUrl||'';state.authError='';
    }catch(e){
      if(!first)return;   // 背景更新失敗就算了，下次再試
      state.authError=e.message||'讀取失敗';
    }
    state.ready=true;render();
  },
  canWrite(){return true},
  newId(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},
  persistLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({entries:state.entries,settings:state.settings}))}catch{toast('這個瀏覽器無法儲存資料')}},
  // 先改畫面，再存到試算表；失敗就還原
  async sync(apply,fn,arg){
    const backup={entries:state.entries.slice(),settings:{...state.settings}};
    apply();render();
    if(this.mode==='local'){this.persistLocal();return}
    this.busy++;
    try{await this.call(fn,arg)}
    catch(e){state.entries=backup.entries;state.settings=backup.settings;render();throw e}
    finally{this.busy--}
  },
  async save(item){
    return this.sync(()=>{
      const i=state.entries.findIndex(e=>e.id===item.id);
      if(i>=0)state.entries[i]=item;else state.entries.push(item);
    },'apiSave',item);
  },
  async remove(id){
    return this.sync(()=>{state.entries=state.entries.filter(e=>e.id!==id)},'apiRemove',id);
  },
  async saveSettings(next){
    return this.sync(()=>{state.settings={...state.settings,...next}},'apiSaveSettings',{...state.settings,...next});
  }
};
</script>
<script>
// ==========================================================
// js/views/records.js
// 「明細」分頁：每月收支總覽＋每天的記帳列表。
// ==========================================================

// 月份切換列（明細、統計共用）
function monthBar(){
  return `<div class="monthbar">
    <button class="icon-btn" data-month="-1" aria-label="上個月">‹</button>
    <b>${monthLabel(state.month)}</b>
    <button class="icon-btn" data-month="1" aria-label="下個月">›</button>
    ${state.month!==today().slice(0,7)?'<button class="chip" data-month="now">回本月</button>':''}
  </div>`;
}

// 收入／支出／結餘三格
function sumBoxes(s){
  const net=r2(s.income-s.expense);
  return `<div class="stats3">
    <div><small>收入</small><b class="num inc">${money(s.income)}</b></div>
    <div><small>支出</small><b class="num exp">${money(s.expense)}</b></div>
    <div><small>結餘</small><b class="num ${net<0?'exp':''}">${money(net)}</b></div>
  </div>`;
}

// 名字還沒設定時的提醒
function nameHint(){
  if(state.settings.nameA&&state.settings.nameB)return '';
  return `<div class="notice">第一次使用？先到「設定」填上兩人的名字。<button class="btn small primary" data-view="settings">去設定</button></div>`;
}

// 一筆記帳的列（明細、分帳共用）
function entryRow(e,extra=''){
  let icon,title,sub,amt,cls;
  if(e.type==='transfer'){
    icon='還';title='還款';sub=`${nm(e.from)} → ${nm(e.to)}`;amt=money(e.amount);cls='tr';
  }else if(e.type==='income'){
    icon=(e.category||'收')[0];title=e.category||'收入';
    sub=e.owner==='both'?'共同收入':`${nm(e.owner)}的收入`;amt='+'+money(e.amount);cls='inc';
  }else{
    icon=(e.category||'支')[0];title=e.category||'支出';
    const sp=SPLITS.find(s=>s.id===e.split)?.label||'';
    sub=`${nm(e.payer)}付 · ${sp}`;
    const t=effectText(e);if(t)sub+=` · <span class="owe">${esc(t)}</span>`;
    amt=money(e.amount);cls='exp';
  }
  return `<button class="row" data-edit="${esc(e.id)}">
    <span class="cat ${cls}">${esc(icon)}</span>
    <span class="row-main"><span class="row-t"><b>${esc(title)}</b>${e.note?`<span class="note">${esc(e.note)}</span>`:''}</span><small>${sub}</small>${extra}</span>
    <span class="amt num ${cls}">${amt}</span>
  </button>`;
}

function viewRecords(){
  const list=state.entries.filter(e=>(e.date||'').startsWith(state.month));
  const s=summarize(list);
  const shown=list.filter(e=>state.filter==='all'||e.type===state.filter).sort((a,b)=>-byDate(a,b));
  // 依日期分組
  const days={};for(const e of shown)(days[e.date]??=[]).push(e);
  const groups=Object.keys(days).map(d=>{
    const ds=summarize(days[d]);
    return `<section class="day"><div class="day-h"><b>${dayLabel(d)}</b><small class="num">${ds.expense?'支出 '+money(ds.expense):''}${ds.income?'　收入 '+money(ds.income):''}</small></div>
      <div class="card list">${days[d].map(e=>entryRow(e)).join('')}</div></section>`;
  }).join('');
  const f=[['all','全部'],['expense','支出'],['income','收入'],['transfer','還款']];
  return `${nameHint()}${monthBar()}${sumBoxes(s)}
    <div class="chips">${f.map(([id,l])=>`<button class="chip ${state.filter===id?'on':''}" data-filter="${id}">${l}</button>`).join('')}</div>
    ${groups||'<div class="empty">這個月還沒有紀錄，按右下角「記一筆」開始。</div>'}`;
}
</script>
<script>
// ==========================================================
// js/views/settle.js
// 「分帳」分頁：目前誰要給誰多少錢、每一筆怎麼算出來的。
// ==========================================================

function viewSettle(){
  const {balance,rows,lastZero}=settlement(state.entries);
  const open=rows.slice(lastZero+1);            // 上次兩清之後的紀錄
  const list=(state.settleAll?rows:open).slice().reverse();
  // 未結清期間：各自幫對方墊了多少、已還多少
  let aForB=0,bForA=0,paid=0;
  for(const r of open){
    if(r.e.type==='transfer')paid+=r.e.amount;
    else if(r.v>0)aForB+=r.v;else bForA+=-r.v;
  }
  const debtor=balance>0?'B':'A', creditor=other(debtor), amt=Math.abs(balance);
  const hero=amt<0.005
    ?`<div class="hero even"><small>目前</small><div class="hero-big">兩清</div><p>沒有人欠誰錢</p></div>`
    :`<div class="hero"><small>目前</small>
        <div class="hero-who"><span class="pa-${debtor}">${esc(nm(debtor))}</span> 要給 <span class="pa-${creditor}">${esc(nm(creditor))}</span></div>
        <div class="hero-big num">${money(amt)}</div>
        <button class="btn primary" data-action="settleup">記錄還款</button>
      </div>`;
  const items=list.map(r=>entryRow(r.e,`<small class="run num">累計：${
    Math.abs(r.bal)<0.005?'兩清':`${esc(nm(r.bal>0?'B':'A'))} 欠 ${esc(nm(r.bal>0?'A':'B'))} ${money(Math.abs(r.bal))}`}　·　${dayLabel(r.e.date)}</small>`)).join('');
  return `${nameHint()}${hero}
    <div class="stats3">
      <div><small>${esc(nm('A'))} 幫 ${esc(nm('B'))} 墊</small><b class="num">${money(aForB)}</b></div>
      <div><small>${esc(nm('B'))} 幫 ${esc(nm('A'))} 墊</small><b class="num">${money(bForA)}</b></div>
      <div><small>已還款</small><b class="num">${money(paid)}</b></div>
    </div>
    <p class="hint">只有「平分」「自訂」「幫對方付」的支出會算進分帳；「自己的」花費不會。上方數字是上次兩清之後的累計。</p>
    <div class="chips">
      <button class="chip ${state.settleAll?'':'on'}" data-settle="open">未結清（${open.length}）</button>
      <button class="chip ${state.settleAll?'on':''}" data-settle="all">全部紀錄（${rows.length}）</button>
    </div>
    ${items?`<div class="card list">${items}</div>`:'<div class="empty">沒有需要分帳的紀錄。</div>'}`;
}
</script>
<script>
// ==========================================================
// js/views/stats.js
// 「統計」分頁：分類占比、兩人花費、近幾個月趨勢。
// ==========================================================

// 橫條圖（分類）
function hbars(obj,cls){
  const arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const total=arr.reduce((a,[,v])=>a+v,0);
  if(!arr.length)return '<div class="empty small">沒有資料</div>';
  const max=arr[0][1];
  return `<div class="hbars">${arr.map(([k,v])=>`<div class="hbar">
    <span class="hb-k">${esc(k)}</span>
    <span class="hb-track"><span class="hb-fill ${cls}" style="width:${(v/max*100).toFixed(1)}%"></span></span>
    <span class="hb-v num">${money(v)}<small>${Math.round(v/total*100)}%</small></span></div>`).join('')}</div>`;
}

function viewStats(){
  const list=state.entries.filter(e=>(e.date||'').startsWith(state.month));
  const s=summarize(list);
  // 近幾個月趨勢
  const months=[];for(let i=TREND_MONTHS-1;i>=0;i--)months.push(shiftMonth(state.month,-i));
  const ms=months.map(m=>({m,...summarize(state.entries.filter(e=>(e.date||'').startsWith(m)))}));
  const max=Math.max(1,...ms.map(x=>Math.max(x.income,x.expense)));
  const trend=`<div class="trend">${ms.map(x=>`<div class="tcol ${x.m===state.month?'cur':''}" title="${monthLabel(x.m)}　收入 ${money(x.income)}　支出 ${money(x.expense)}">
      <div class="tbars"><span class="tb inc" style="height:${x.income/max*100}%"></span><span class="tb exp" style="height:${x.expense/max*100}%"></span></div>
      <small>${+x.m.slice(5)}月</small></div>`).join('')}</div>
    <div class="legend"><span><i class="inc"></i>收入</span><span><i class="exp"></i>支出</span></div>`;
  const person=p=>`<tr><th><span class="dot pa-${p}"></span>${esc(nm(p))}</th><td class="num">${money(s['paid'+p])}</td><td class="num">${money(s['use'+p])}</td></tr>`;
  return `${monthBar()}${sumBoxes(s)}
    <section class="card pad"><h3>支出分類</h3>${hbars(s.cats,'exp')}</section>
    <section class="card pad"><h3>兩人花費</h3>
      <table class="tbl"><thead><tr><th></th><th>實際掏錢</th><th>自己花掉</th></tr></thead><tbody>${person('A')}${person('B')}</tbody></table>
      <p class="hint">「實際掏錢」是誰付的帳；「自己花掉」是依分攤方式算出各自吃了多少。</p></section>
    <section class="card pad"><h3>收入分類</h3>${hbars(s.incomeCats,'inc')}</section>
    <section class="card pad"><h3>近 ${TREND_MONTHS} 個月收支</h3>${trend}</section>`;
}
</script>

<script>
// ==========================================================

  $('#tabbar').innerHTML=VIEWS.map(v=>`<button class="tab ${state.view===v.id?'on':''}" data-view="${v.id}">

<script>
// ==========================================================
// js/form.js
// 記一筆／編輯表單。欄位會依「支出／收入／還款」切換。
// 表單內容放在 state.draft，按按鈕切換選項時重畫表單。
// ==========================================================

// 分段按鈕（例如：誰付的 A / B）
function seg(key,opts){
  return `<div class="seg">${opts.map(o=>`<button type="button" class="${String(state.draft[key])===String(o.id)?'on':''}" data-set="${key}:${o.id}">${esc(o.label??nm(o.id))}</button>`).join('')}</div>`;
}
const field=(label,inner,cls='')=>`<div class="field ${cls}"><span class="lbl">${label}</span>${inner}</div>`;

// 開啟表單：item = 要編輯的資料；preset = 新增時的預設值
function openForm(item,preset={}){
  const d=item?{...item}:{type:'expense',date:today(),amount:'',category:'',note:'',payer:'',split:'equal',owner:'',from:'',to:'',...preset};
  if(d.type==='expense'&&d.split==='custom')d.customA=d.shareA;
  state.draft=d;
  $('#formTitle').textContent=item?'編輯':'記一筆';
  $('#delBtn').hidden=!item;delete $('#delBtn').dataset.armed;$('#delBtn').textContent='刪除';
  renderForm();
  $('#scrim').hidden=false;document.body.classList.add('lock');
  if(!item)setTimeout(()=>$('#formBody [name=amount]')?.focus(),60);
}
function closeForm(){$('#scrim').hidden=true;document.body.classList.remove('lock');state.draft=null}

function renderForm(){
  const d=state.draft, st=state.settings;
  let h=field('類型',seg('type',TYPES));
  h+=`<div class="row2">${field('金額',`<input name="amount" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.amount)}" placeholder="0" class="big num" required>`)}
      ${field('日期',`<input name="date" type="date" value="${esc(d.date)}" required>`)}</div>`;
  if(d.type==='transfer'){
    h+=field('誰還給誰',`<div class="seg">
      <button type="button" class="${d.from==='A'?'on':''}" data-set="from:A">${esc(nm('A'))} → ${esc(nm('B'))}</button>
      <button type="button" class="${d.from==='B'?'on':''}" data-set="from:B">${esc(nm('B'))} → ${esc(nm('A'))}</button></div>`,d.from?'':'need');
  }else{
    const cats=d.type==='income'?st.incomeCats:st.expenseCats;
    if(!cats.includes(d.category))d.category=cats[0]||'';
    h+=field('分類',`<div class="chips cwrap">${cats.map(c=>`<button type="button" class="chip ${d.category===c?'on':''}" data-set="category:${esc(c)}">${esc(c)}</button>`).join('')}</div>`);
  }
  if(d.type==='expense'){
    h+=field('誰付的',seg('payer',[{id:'A'},{id:'B'}]),d.payer?'':'need');
    h+=field('怎麼分',seg('split',SPLITS));
    if(d.split==='custom')h+=`<div class="row2">
      ${field(esc(nm('A'))+' 的部分',`<input name="customA" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.customA??'')}" class="num">`)}
      ${field(esc(nm('B'))+' 的部分',`<input name="customB" type="number" inputmode="decimal" min="0" step="any" value="${esc(d.customA!==undefined&&d.customA!==''?r2((+d.amount||0)-d.customA):'')}" class="num">`)}</div>`;
    h+=`<div class="preview" id="preview"></div>`;
  }
  if(d.type==='income')h+=field('誰的收入',seg('owner',INCOME_OWNERS),d.owner?'':'need');
  h+=field('備註',`<input name="note" value="${esc(d.note||'')}" placeholder="${d.type==='expense'?'例如：午餐、全聯':'選填'}" maxlength="40">`);
  $('#formBody').innerHTML=h;
  updatePreview();
}

// 表單下方即時顯示「誰要給誰多少」
function updatePreview(){
  const d=state.draft,p=$('#preview');if(!p||d.type!=='expense')return;
  const amt=+d.amount||0;
  if(!amt||!d.payer){p.innerHTML=`<small>${amt?'選「誰付的」後':'輸入金額後'}會顯示分帳結果</small>`;return}
  const s=computeShares(amt,d.payer,d.split,+d.customA||0);
  const e={type:'expense',payer:d.payer,...s};
  const t=effectText(e);
  p.innerHTML=`<span>${esc(nm('A'))} ${money(s.shareA)}　·　${esc(nm('B'))} ${money(s.shareB)}</span><b>${t?esc(t):'不用分帳'}</b>`;
}

// 把表單內容整理成要存的資料
function buildItem(){
  const d=state.draft, amount=r2(d.amount);
  const base={id:d.id||store.newId(),type:d.type,date:d.date,amount,note:(d.note||'').trim(),
    createdAt:d.createdAt||new Date().toISOString(),createdBy:d.createdBy||'',updatedAt:new Date().toISOString()};
  if(d.type==='expense'){
    if(d.split==='custom'&&(+d.customA<0||+d.customA>amount))throw '自訂金額不能超過總金額';
    return {...base,category:d.category,payer:d.payer,split:d.split,...computeShares(amount,d.payer,d.split,+d.customA||0)};
  }
  if(d.type==='income')return {...base,category:d.category,owner:d.owner};
  return {...base,from:d.from,to:other(d.from)};
}

async function submitForm(){
  const d=state.draft;
  if(!(+d.amount>0))return toast('請輸入金額');
  if(!d.date)return toast('請選日期');
  if(d.type==='expense'&&!d.payer)return toast('請選誰付的');
  if(d.type==='income'&&!d.owner)return toast('請選誰的收入');
  if(d.type==='transfer'&&!d.from)return toast('請選誰還給誰');
  let item;try{item=buildItem()}catch(m){return toast(m)}
  closeForm();
  try{await store.save(item);toast('已儲存')}
  catch(e){toast('儲存失敗：'+(e?.message||e?.code||e))}
}
async function deleteEntry(){
  const d=state.draft;if(!d?.id)return;
  const b=$('#delBtn');   // 按第一次變成「確定刪除？」，再按一次才刪除
  if(!b.dataset.armed){b.dataset.armed='1';b.textContent='確定刪除？';return}
  closeForm();
  try{await store.remove(d.id);toast('已刪除')}catch(e){toast('刪除失敗：'+(e?.message||e?.code||e))}
}
</script>
<script>
// ==========================================================
// js/events.js
// 按鈕與輸入事件（全部集中在這裡）。
// ==========================================================

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-edit]');if(!b)return;
  const ds=b.dataset;
  if(ds.view){state.view=ds.view;render();scrollTo(0,0);return}
  if(ds.month){state.month=ds.month==='now'?today().slice(0,7):shiftMonth(state.month,+ds.month);render();return}
  if(ds.filter){state.filter=ds.filter;render();return}
  if(ds.settle){state.settleAll=ds.settle==='all';render();return}
  if(ds.edit){const it=state.entries.find(x=>x.id===ds.edit);if(it)openForm(it);return}
  if(ds.set){   // 表單裡的分段按鈕
    const i=ds.set.indexOf(':'),k=ds.set.slice(0,i),v=ds.set.slice(i+1);
    state.draft[k]=v;
    if(k==='split'&&v==='custom'&&state.draft.customA===undefined)state.draft.customA=Math.floor((+state.draft.amount||0)/2);
    renderForm();return;
  }
  if(ds.delcat){
    const [k,i]=ds.delcat.split(':');
    if(state.settings[k].length<=1)return toast('至少要保留一個分類');
    store.saveSettings({[k]:state.settings[k].filter((_,j)=>j!==+i)}).catch(e=>toast('儲存失敗：'+(e?.message||e?.code)));return;
  }
  switch(ds.action){
    case 'new':openForm(null);break;
    case 'close':closeForm();break;
    case 'delete':deleteEntry();break;
    case 'reload':store.refresh(true).then(()=>toast('已更新'));break;
    case 'settleup':{
      const {balance}=settlement(state.entries);
      const from=balance>0?'B':'A';
      openForm(null,{type:'transfer',from,to:other(from),amount:Math.abs(balance),note:'結清'});
      break;
    }
  }
});

// 表單輸入：即時更新 draft
$('#form').addEventListener('input',e=>{
  const t=e.target,d=state.draft;if(!d||!t.name)return;
  if(t.name==='customB'){   // 填 B 的部分 → 自動算 A 的部分
    d.customA=t.value===''?'':r2((+d.amount||0)-(+t.value||0));
    const a=$('#form [name=customA]');if(a)a.value=d.customA;
  }else{
    d[t.name]=t.value;
    if(t.name==='customA'||t.name==='amount'){
      const b=$('#form [name=customB]');
      if(b&&d.customA!==''&&d.customA!==undefined)b.value=r2((+d.amount||0)-(+d.customA||0));
    }
  }
  updatePreview();
});
$('#form').addEventListener('submit',e=>{e.preventDefault();submitForm()});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeForm()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeForm()});

// 設定頁：儲存名字、新增分類
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='peopleForm'){
    e.preventDefault();
    store.saveSettings({nameA:f.nameA.value.trim(),nameB:f.nameB.value.trim()}).then(()=>toast('已儲存')).catch(e=>toast('儲存失敗：'+(e?.message||e?.code)));
  }else if(f.dataset.addcat){
    e.preventDefault();
    const k=f.dataset.addcat,v=f.c.value.trim();
    if(!v)return;if(state.settings[k].includes(v))return toast('已經有這個分類');
    store.saveSettings({[k]:[...state.settings[k],v]}).catch(e=>toast('儲存失敗：'+(e?.message||e?.code)));
  }
});
</script>
<script>
// ==========================================================
// js/main.js
// 程式進入點：先畫出畫面，再開始讀取資料。必須是最後一個載入的檔案。
// ==========================================================

render();
store.init();
</script>
</body>
</html>
