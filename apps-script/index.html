<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<!--
  index（網頁骨架）
  這個檔案只放畫面的骨架（頁首、分頁列、表單外框）。
  樣式在 css/ 資料夾、功能在 js/ 資料夾，用 include('檔名') 插進來（include 在 Code.gs）。
  載入順序很重要：後面的檔案會用到前面檔案的東西，js/main 一定要最後。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">

<!-- ===== 樣式：顏色主題 → 版面與共用元件 → 各分頁 → 表單 ===== -->
<?!= include('css/base') ?>
<?!= include('css/layout') ?>
<?!= include('css/views') ?>
<?!= include('css/form') ?>
</head>
<body>
<div class="wrap">
  <!-- ===== 頁首 ===== -->
  <header class="top">
    <div class="logo" aria-hidden="true">帳</div>
    <h1>家庭記帳</h1>
    <div class="who" id="who"></div>
  </header>
  <!-- ===== 主要內容（由 js/views/ 產生） ===== -->
  <main id="view"><div class="empty">載入中…</div></main>
</div>

<!-- ===== 底部分頁列（按鈕由 js/render.js 產生） ===== -->
<nav class="tabbar" id="tabbar" aria-label="分頁"></nav>

<!-- ===== 右下角「記一筆」按鈕 ===== -->
<button class="fab" id="fab" type="button" data-action="new">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>記一筆</span>
</button>

<!-- ===== 新增／編輯表單（欄位由 js/form.js 產生） ===== -->
<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="sheet-h"><h2 id="formTitle">記一筆</h2><button type="button" class="x" data-action="close" aria-label="關閉">×</button></div>
    <div class="sheet-b" id="formBody"></div>
    <div class="sheet-f">
      <button type="button" class="btn danger" id="delBtn" data-action="delete" hidden>刪除</button>
      <button type="button" class="btn" data-action="close">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<!-- ===== 基本設定與工具 ===== -->
<?!= include('js/constants') ?>
<?!= include('js/utils') ?>
<?!= include('js/state') ?>
<?!= include('js/calc') ?>
<?!= include('js/store') ?>

<!-- ===== 各畫面（js/views） ===== -->
<?!= include('js/views/records') ?>
<?!= include('js/views/calendar') ?>
<?!= include('js/views/settle') ?>
<?!= include('js/views/stats') ?>
<?!= include('js/views/member') ?>
<?!= include('js/views/budget') ?>
<?!= include('js/views/accounts') ?>
<?!= include('js/views/settings') ?>

<!-- ===== 重畫畫面、表單（js/forms）、事件 ===== -->

<?!= include('js/forms/common') ?>

<!-- ===== 程式進入點（一定要最後） ===== -->

</body>
</html>
